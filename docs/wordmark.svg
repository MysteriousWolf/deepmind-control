<svg xmlns="http://www.w3.org/2000/svg" viewBox="241.5 70.35 646.0 78.87" width="646.0" height="78.87" role="img" aria-label="deepmind control">
  <title>deepmind control</title>
  <!--
    The project's name, exactly as `banner.svg` sets it: outlined from Liberation
    Sans Bold so that it renders the same everywhere, tracked -20 units of the
    2048 em, fitted to the box the library's name occupies — ink from x 244.5 to
    x 884.5 on a baseline of 130 — and cut by the five slices that *are* the
    mark. The coordinates are the banner's own, so the two cannot drift apart:
    the viewBox is the ink's measured bounds and nothing has been moved.

    It is a file rather than a drawing in the application because the slices are
    the thing that has to be right. Five lines from a sixtieth of an em to a
    twentieth, laid over a word by a window that rounds each of them to whatever
    the pointer's device gives it, is five bands of grey at five different
    weights; the same five as vector are the same five at any size.
  -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f8"/>
      <stop offset="0.55" stop-color="#c9cdd6"/>
      <stop offset="1" stop-color="#8e939f"/>
    </linearGradient>
