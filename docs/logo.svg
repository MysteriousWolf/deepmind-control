<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="deepmind-control">
  <title>deepmind-control</title>
  <!--
    The case deepmind-midi's mark uses, drawn the same way: a dark panel
    between wooden end cheeks, sliced by the same horizontal lines of the
    DeepMind wordmark. Where that mark is the socket the bytes arrive through,
    this one is the surface a player puts their hands on.

    The cap heights are not arbitrary. Each sits where one of those lines
    crosses it, so the slice falls through the middle of a cap and never at its
    edge, and the highest cap stands clear of the lines altogether.
  -->
  <defs>
    <clipPath id="case"><rect width="128" height="128" rx="24"/></clipPath>
    <clipPath id="cheeks">
      <rect x="0" width="13" height="128"/>
      <rect x="115" width="13" height="128"/>
    </clipPath>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9552c"/>
      <stop offset="1" stop-color="#8a3f1f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#282c36"/>
      <stop offset="1" stop-color="#15181e"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f8"/>
      <stop offset="0.5" stop-color="#c9cdd6"/>
      <stop offset="1" stop-color="#8e939f"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="0.6" stop-color="#11141a"/>
      <stop offset="1" stop-color="#242932"/>
    </linearGradient>
    <mask id="cuts">
      <rect width="128" height="128" fill="#fff"/>
      <rect x="0" y="52" width="128" height="1" fill="#000"/>
      <rect x="0" y="58.5" width="128" height="1.3" fill="#000"/>
      <rect x="0" y="65" width="128" height="1.6" fill="#000"/>
      <rect x="0" y="71.5" width="128" height="2" fill="#000"/>
      <rect x="0" y="78" width="128" height="2.4" fill="#000"/>
      <rect x="0" y="84.5" width="128" height="2.8" fill="#000"/>
      <rect x="0" y="91" width="128" height="3.2" fill="#000"/>
      <rect x="0" y="97.5" width="128" height="3.6" fill="#000"/>
    </mask>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g clip-path="url(#case)">
    <rect width="128" height="128" fill="url(#wood)"/>
    <!-- Wood grain: a few lines running the length of each cheek. -->
    <g clip-path="url(#cheeks)" fill="none" stroke-linecap="round">
      <g stroke="#6f3116" stroke-width="1.1" opacity="0.7">
        <path d="M 3 -4 C 2 30 5 60 3.5 90 S 3 120 4 132"/>
        <path d="M 8.5 -4 C 9.5 25 7 55 8.5 85 S 9.5 115 8 132"/>
        <path d="M 118.5 -4 C 117.5 30 120.5 60 119 90 S 118.5 120 119.5 132"/>
        <path d="M 124 -4 C 125 25 122.5 55 124 85 S 125 115 123.5 132"/>
      </g>
      <g stroke="#c26436" stroke-width="0.8" opacity="0.55">
        <path d="M 5.8 -4 C 5 35 7 65 5.8 95 S 5.2 120 6 132"/>
        <path d="M 11 -4 C 11.5 40 10 70 11 100 S 11.5 125 10.8 132"/>
        <path d="M 121.4 -4 C 120.6 35 122.6 65 121.4 95 S 120.8 120 121.6 132"/>
        <path d="M 116.5 -4 C 117 40 115.5 70 116.5 100 S 117 125 116.3 132"/>
      </g>
    </g>
    <!-- The panel, with a seam and a lip where it meets the wood. -->
    <rect x="13" width="102" height="128" fill="url(#panel)"/>
    <rect x="13" width="1.4" height="128" fill="#000" opacity="0.5"/>
    <rect x="113.6" width="1.4" height="128" fill="#000" opacity="0.5"/>
    <rect x="14.4" width="0.8" height="128" fill="#454b58"/>
    <rect x="112.8" width="0.8" height="128" fill="#454b58"/>
  </g>

  <!-- Four faders: the slot cut into the panel, and the cap that rides it. -->
  <g fill="url(#slot)">
    <rect x="29" y="30" width="8" height="70" rx="4"/>
    <rect x="60" y="30" width="8" height="70" rx="4"/>
    <rect x="91" y="30" width="8" height="70" rx="4"/>
  </g>
  <g fill="none" stroke="#000" stroke-width="1" opacity="0.6">
    <rect x="29" y="30" width="8" height="70" rx="4"/>
    <rect x="60" y="30" width="8" height="70" rx="4"/>
    <rect x="91" y="30" width="8" height="70" rx="4"/>
  </g>
  <g fill="none" stroke="#7d838f" stroke-width="0.9" stroke-linecap="round" opacity="0.55">
    <path d="M 29.30 97.52 A 4 4 0 0 0 36.70 97.52"/>
    <path d="M 60.30 97.52 A 4 4 0 0 0 67.70 97.52"/>
    <path d="M 91.30 97.52 A 4 4 0 0 0 98.70 97.52"/>
  </g>
  <g filter="url(#drop)" mask="url(#cuts)">
    <g fill="url(#metal)" stroke="#0b0d11" stroke-width="0.9">
      <rect x="20" y="81.6" width="26" height="8.6" rx="2"/>
      <rect x="51" y="40.7" width="26" height="8.6" rx="2"/>
      <rect x="82" y="68.2" width="26" height="8.6" rx="2"/>
    </g>
    <g fill="#15181e" opacity="0.6">
      <rect x="22.4" y="85.45" width="21.2" height="0.9"/>
      <rect x="53.4" y="44.55" width="21.2" height="0.9"/>
      <rect x="84.4" y="72.05" width="21.2" height="0.9"/>
    </g>
    <g fill="#ffffff" opacity="0.45">
      <rect x="22.4" y="82.8" width="21.2" height="1"/>
      <rect x="53.4" y="41.9" width="21.2" height="1"/>
      <rect x="84.4" y="69.4" width="21.2" height="1"/>
    </g>
  </g>
</svg>
