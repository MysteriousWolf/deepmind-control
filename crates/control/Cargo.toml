[package]
name = "control"
description = "The DeepMind editor and librarian, on the desktop"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
## Builds the `previews` binary: the tool that photographs every surface this
## window has, which a release is not made without. Off by default, because
## nothing in the shipped editor reaches it and a screenshot encoder is not
## something an editor should be carrying.
previews = ["dep:png"]

[dependencies]
control-ui = { path = "../control-ui" }
deepmind-host = { path = "../deepmind-host" }
deepmind-midi = { workspace = true }
deepmind-patches = { workspace = true }
iced = { workspace = true, features = [
    # The project's own name is a file rather than a drawing: `docs/wordmark.svg`
    # carries the outlined letters and the five slices that are the mark, so
    # what the header draws is the banner's own geometry at whatever size the
    # window has for it. See `window::wordmark`.
    "svg",
] }
# The system's own file chooser, and the only new dependency the librarian
# needs. The XDG portal backend rather than the GTK one: it is Rust the whole way
# down, so a Linux build needs no GTK development headers, and it blocks on
# `pollster` rather than dragging an async runtime into a repository that gets
# its frames from `thread::sleep`. `wayland` is kept because it is what lets the
# portal parent its dialog to this window, and winit has already brought those
# crates in on Linux. macOS and Windows use their own backends and read neither
# feature.
rfd = { version = "0.17", default-features = false, features = [
    "xdg-portal",
    "wayland",
] }
# What a preview is written out as. Already in the tree, because `iced`'s `svg`
# feature brings it in to draw the wordmark, so the release tool costs no new
# crate.
png = { version = "0.17", optional = true }

[[bin]]
name = "previews"
required-features = ["previews"]

[[bin]]
name = "control"
path = "src/main.rs"


[lints]
workspace = true
