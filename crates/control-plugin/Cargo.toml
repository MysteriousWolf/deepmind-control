[package]
name = "control-plugin"
description = "The DeepMind editor as a plugin: a CLAP, and the AU and VST3 wrapped around it"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The plugin is stage 6, and nothing is built two stages before it is needed:
# `nih-plug`, `baseview` and the iced adapter arrive with the code that uses
# them. What exists here now is the crate they will arrive into.
[dependencies]
control-ui = { path = "../control-ui" }
deepmind-midi = { workspace = true }

[lib]
crate-type = ["lib"]

[lints]
workspace = true
